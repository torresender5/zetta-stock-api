services:
  api:
    image: torresender5/zettastock-api:latest
    container_name: zettastock-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zettastock.com}
      LOG_FILE: /app/logs/api.log
    volumes:
      - api-logs:/app/logs
    networks:
      - zettastock-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Opcional: expone el API directo en el host solo para debug local
    # ports:
    #   - "127.0.0.1:3000:3000"

networks:
  zettastock-net:
    external: true

volumes:
  api-logs: